name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # Hosted macOS ARM64 capacity currently cancels jobs before acquisition.
        # Keep the full macOS suite on the supported Intel runner instead.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      # The plugin imports Hermes core (providers, agent) from a checkout, the way an installed plugin does.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      # Hermes runtime dependencies are gated on Python >=3.14. Use its lock
      # and overrides too (plain pip cannot resolve its Pillow/browser-harness pins).
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install hermes-agent and locked test dependencies
        working-directory: hermes-agent
        run: uv sync --locked --group dev
      - name: Run the plugin suite (real subprocess tree, real cancellation)
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: uv run --project ../hermes-agent --no-sync python -m pytest -q
